<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Управление категориями — ФармаПлюс CMS</title>
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="admin-layout">
    <aside class="sidebar" id="admin-sidebar">
      <div class="sidebar__logo"><span class="sidebar__logo-icon">💊</span> Фарма<span>Плюс</span></div>
      <nav class="sidebar__nav">
        <a href="index.html" class="sidebar__link"><span class="sidebar__link-icon">📊</span> Дашборд</a>
        <a href="products.html" class="sidebar__link"><span class="sidebar__link-icon">📦</span> Товары</a>
        <a href="add-product.html" class="sidebar__link"><span class="sidebar__link-icon">➕</span> Добавить товар</a>
        <a href="orders.html" class="sidebar__link"><span class="sidebar__link-icon">🧾</span> Заказы</a>
        <a href="categories.html" class="sidebar__link sidebar__link--active"><span class="sidebar__link-icon">📁</span> Категории</a>
      </nav>
      <div class="sidebar__footer"><a href="../index.html" class="sidebar__store-link">🌐 Перейти в магазин</a><a href="#" class="sidebar__store-link" id="admin-logout-btn" style="margin-top:8px;color:#ff6b6b;">🚪 Выйти</a></div>
    </aside>
    <div style="position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:99;display:none" id="sidebar-overlay"></div>

    <div class="admin-content">
      <header class="admin-header">
        <div class="admin-header__left">
          <button class="admin-header__burger" id="admin-burger"><span></span><span></span><span></span></button>
          <div class="admin-header__search">
            <span class="admin-header__search-icon">🔍</span>
            <input type="text" class="admin-header__search-input" placeholder="Поиск по панели...">
          </div>
        </div>
        <div class="admin-header__right">
          <button class="admin-header__notif">🔔<span class="admin-header__notif-dot"></span></button>
          <div class="admin-header__user">
            <div class="admin-header__avatar">АД</div>
            <div><div class="admin-header__user-name">Администратор</div><div class="admin-header__user-role">Суперадмин</div></div>
          </div>
        </div>
      </header>

      <main class="admin-main">
        <h1 class="admin-page-title">Управление категориями <span id="categories-count" style="font-size:.9rem;color:var(--admin-text-muted);font-weight:400"></span></h1>

        <div class="toolbar">
          <div class="toolbar__left"></div>
          <button class="btn btn--primary" onclick="openAddCategory()">➕ Новая категория</button>
        </div>

        <div class="panel">
          <div id="categories-list"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Add/Edit Category Modal -->
  <div class="modal-overlay" id="category-modal">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title" id="cat-modal-title">Новая категория</h3>
        <button class="modal__close" onclick="closeModal('category-modal')">✕</button>
      </div>
      <div class="modal__body">
        <input type="hidden" id="cat-editing-id">
        <div class="form-group">
          <label class="form-label form-label--required" for="cat-id">ID (латиницей)</label>
          <input type="text" class="form-input" id="cat-id" placeholder="например: supplements">
        </div>
        <div class="form-group">
          <label class="form-label form-label--required" for="cat-label">Название</label>
          <input type="text" class="form-input" id="cat-label" placeholder="Например: Добавки">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="cat-icon">Эмодзи-иконка</label>
            <input type="text" class="form-input" id="cat-icon" placeholder="💊">
          </div>
          <div class="form-group">
            <label class="form-label" for="cat-color">Цвет</label>
            <input type="color" class="form-input" id="cat-color" value="#00a651" style="height:42px;padding:4px">
          </div>
        </div>
      </div>
      <div class="modal__footer">
        <button class="btn btn--outline" onclick="closeModal('category-modal')">Отмена</button>
        <button class="btn btn--primary" onclick="saveCategory()">💾 Сохранить</button>
      </div>
    </div>
  </div>

  <!-- Delete Category Modal -->
  <div class="modal-overlay" id="delete-cat-modal">
    <div class="modal">
      <div class="modal__header">
        <h3 class="modal__title">Удалить категорию</h3>
        <button class="modal__close" onclick="closeModal('delete-cat-modal')">✕</button>
      </div>
      <div class="modal__body"></div>
      <div class="modal__footer">
        <button class="btn btn--outline" onclick="closeModal('delete-cat-modal')">Отмена</button>
        <button class="btn btn--danger" id="confirm-delete-cat-btn">Удалить</button>
      </div>
    </div>
  </div>

  <script src="js/admin.js"></script>
  <script src="js/categories.js"></script>
</body>
</html>
