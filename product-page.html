<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Товар — ФармаПлюс</title>
  <meta name="description"
    content="Подробное описание товара, характеристики, рейтинг и отзывы в интернет-аптеке ФармаПлюс.">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- HEADER -->
  <header class="header">
    <div class="header__topbar">
      <div class="container header__topbar-inner">
        <span class="header__contact">📞 +7 (999) 999-99-99</span>
      </div>
    </div>
    <div class="header__main">
      <div class="container header__inner">
        <a href="index.html" class="header__logo">
          <span class="header__logo-icon">💊</span>
          <span class="header__logo-text">Фарма<span>Плюс</span></span>
        </a>
        <div class="header__actions">
          <a href="cart.html" class="header__cart">
            🛒 <span class="badge header__cart-badge" style="display:none;">0</span>
          </a>
          <button class="header__burger" id="burger-btn">
            <span></span><span></span><span></span>
          </button>
        </div>
      </div>
    </div>
    <nav class="header__nav">
      <div class="container header__nav-inner">
        <a href="index.html" class="header__nav-link">Главная</a>
        <a href="categories.html" class="header__nav-link">Категории</a>
        <a href="catalog.html" class="header__nav-link">Каталог</a>
        <a href="orders.html" class="header__nav-link">История заказов</a>
        <a href="contacts.html" class="header__nav-link">Контакты</a>
      </div>
    </nav>
  </header>

  <main class="page product-page" id="product-container">

  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <div class="footer__brand">
        <a href="index.html" class="footer__logo">💊 ФармаПлюс</a>
        <p>© 2026 Все права защищены.</p>
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const productId = parseInt(urlParams.get('id'));
      const container = document.getElementById('product-container');

      if (!productId) {
        document.title = 'Товар не найден — ФармаПлюс';
        container.innerHTML = '<div class="container" style="padding:60px 20px;text-align:center;"><h1>Товар не найден</h1><a href="catalog.html" class="btn btn--primary" style="margin-top:16px;">Назад в каталог</a></div>';
        return;
      }


      container.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;padding:80px 20px;gap:12px;"><div style="width:40px;height:40px;border:4px solid #e2e8f0;border-top-color:#00a651;border-radius:50%;animation:spin .7s linear infinite;"></div><span style="color:#6b7c80;">Загрузка...</span></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style>';

      try {
        const product = await fetchProductById(productId);

        document.title = `${product.name} — Купить в ФармаПлюс`;
        const inCart = cart.some(item => item.product.id === product.id);

        container.innerHTML = `
          <div class="container">
            <div class="product-page__grid animate-fadeInUp">
              <div class="product-page__image-wrap">
                ${!product.stock ? '<span class="product-page__badge product-page__badge--out">Нет в наличии</span>' : ''}
                <img src="${product.imageUrl || 'img/placeholder.png'}" alt="${product.name}" class="product-page__image" />
              </div>
              
              <div class="product-page__info">
                <span class="product-page__category">${product.categoryName || 'Без категории'}</span>
                <h1 class="product-page__name">${product.name}</h1>

                <div class="product-page__prices">
                  <span class="product-page__price">${Number(product.price).toLocaleString('ru-RU')} ₽</span>
                </div>

                <div class="product-page__actions">
                  <button 
                    class="btn btn--lg ${inCart ? 'btn--outline' : 'btn--primary'}" 
                    onclick="addToCart(${product.id})" 
                    ${!product.stock ? 'disabled' : ''}
                    id="add-to-cart-${product.id}"
                  >
                    ${inCart ? '✓ В корзине' : 'Добавить в корзину'}
                  </button>
                </div>

                <p class="product-page__desc">${product.description || ''}</p>
                
                <div class="product-page__chars">
                  <div class="product-page__chars-title">Характеристики</div>
                  <table class="product-page__chars-table">
                    <tr class="product-page__chars-row">
                      <td class="product-page__chars-label">Категория</td>
                      <td class="product-page__chars-value">${product.categoryName || '—'}</td>
                    </tr>
                    <tr class="product-page__chars-row">
                      <td class="product-page__chars-label">Наличие</td>
                      <td class="product-page__chars-value">
                        ${product.stock ? '<span class="product-page__in-stock">В наличии</span>' : '<span class="product-page__out-stock">Под заказ</span>'}
                      </td>
                    </tr>
                  </table>
                </div>
              </div>
            </div>
          </div>
        `;
      } catch (error) {
        console.error('Product load error:', error);
        document.title = 'Товар не найден — ФармаПлюс';
        container.innerHTML = '<div class="container" style="padding:60px 20px;text-align:center;"><span style="font-size:3rem;">⚠️</span><h1 style="margin-top:12px;">Товар не найден</h1><p style="color:#6b7c80;margin:8px 0 20px;">Возможно, товар был удалён или сервер недоступен</p><a href="catalog.html" class="btn btn--primary">Назад в каталог</a></div>';
      }
    });
  </script>
</body>

</html>
